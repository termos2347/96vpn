services:
  redis:
    image: redis:7-alpine
    container_name: neuroprompt_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - neuroprompt_net
    ports:
      - "6379:6379"   # если нужно внешнее подключение к Redis

  app:
    build: .
    container_name: neuroprompt_app
    restart: unless-stopped
    command: python run_all.py
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - neuroprompt_net
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  neuroprompt_net:
    driver: bridge

volumes:
  redis_data: